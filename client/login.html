<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Urban Kings & Queens</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <h2 class="auth-title">Welcome back</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <p id="auth-error" class="auth-error"></p>
      <button type="submit" class="btn-gold">Log in</button>
    </form>
    <p class="auth-switch">No account? <a href="signup.html">Sign up</a></p>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
